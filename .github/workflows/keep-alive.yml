name: Supabase Keep-Alive

on:
  schedule:
    # รันอัตโนมัติทุกๆ 2 วัน เวลา 00:00 น. UTC (07:00 น. เช้าเวลาไทย)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # ปุ่มให้กดรันด้วยตัวเองผ่านหน้า GitHub Actions ได้ทันที

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase
        run: |
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://iccvbxlfntrkqzdhgzqn.supabase.co' }}"
          SUPABASE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljY3ZieGxmbnRya3F6ZGhnenFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDc5OTMsImV4cCI6MjEwMDYyMzk5M30.HIFaJCqKRg2y7ZnPK0wuEjoZdXe-GMSS3rsl_kjv-y4' }}"

          # ตัด trailing slash ออก
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed -e 's|/rest/v1/?$||' -e 's|/*$||')
          ENDPOINT="$CLEAN_URL/rest/v1/gender_list?select=id&limit=1"

          echo "🚀 Pinging Supabase at: $ENDPOINT"
          
          # ส่ง request ไป query ฐานข้อมูล
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$ENDPOINT")
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase is ALIVE! Database activity refreshed successfully."
          else
            echo "❌ Failed with status: $HTTP_STATUS"
            exit 1
          fi
